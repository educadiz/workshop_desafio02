name: Workflow Jobs e Dependências

on:                                   # evento de disparo trigger
  workflow_dispatch:                  # ativa o botao de disparo manual

jobs:
  build:                              # primeiro job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Etapa de Build
        run: |
          echo "Executando build da aplicação..."
          echo "Build concluído com sucesso!"

  test:                               # segundo job - depende do build
    runs-on: ubuntu-latest
    needs: build                      # só executa se build for bem-sucedido
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Etapa de Testes
        run: |
          echo "Executando testes..."
          echo "Todos os testes passaram!"

  deploy:                             # terceiro job - depende de build e test
    runs-on: ubuntu-latest
    needs: [build, test]              # só executa se build e test forem bem-sucedidos
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Etapa de Deploy
        run: |
          echo "Realizando deploy da aplicação..."
          echo "Deploy concluído com sucesso!"
